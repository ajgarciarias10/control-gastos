<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing circle -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.2"/>
  
  <!-- Wallet / Card Symbol -->
  <g filter="url(#shadow)">
    <!-- Base card -->
    <rect x="116" y="156" width="280" height="200" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    
    <!-- Magnetic strip or header -->
    <rect x="116" y="196" width="280" height="38" fill="#0f172a"/>
    
    <!-- Currency / Graph indicator -->
    <circle cx="180" cy="295" r="26" fill="url(#accentGrad)"/>
    <text x="180" y="304" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">€</text>
    
    <!-- Trend bars -->
    <rect x="236" y="295" width="16" height="26" rx="8" fill="#38bdf8"/>
    <rect x="264" y="275" width="16" height="46" rx="8" fill="#60a5fa"/>
    <rect x="292" y="255" width="16" height="66" rx="8" fill="#818cf8"/>
    <rect x="320" y="235" width="16" height="86" rx="8" fill="#34d399"/>
  </g>
</svg>
